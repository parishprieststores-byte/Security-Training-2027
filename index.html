<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training 2027">
<meta name="theme-color" content="#1d3557">
<title>Security Training Program 2027</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#16202e;--mute:#5b6778;--navy:#1d3557;--amber:#f2a900;--line:#d9dee6;--ok:#1f7a4d;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#10171f;--card:#19232f;--ink:#e8edf3;--mute:#9aa7b8;--navy:#7fa6d8;--amber:#f2b52a;--line:#2b3846;--ok:#4cc38a;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",Roboto,Arial,sans-serif;padding-bottom:env(safe-area-inset-bottom,0)}
header{background:#1d3557;color:#fff;padding:calc(22px + env(safe-area-inset-top,0px)) 16px 18px;border-bottom:5px solid var(--amber)}
header h1{margin:0;font-size:1.45rem;line-height:1.2}
header p{margin:6px 0 0;opacity:.85;font-size:.92rem}
main{max-width:760px;margin:0 auto;padding:16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
button{font:inherit;border:0;border-radius:8px;padding:10px 14px;cursor:pointer;background:var(--navy);color:#fff;font-weight:600}
@media (prefers-color-scheme:dark){button{color:#10171f}}
button.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.next{background:var(--card);border-left:6px solid var(--amber);border-radius:8px;padding:12px 14px;margin-bottom:14px}
.next b{display:block}
.row{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.date{min-width:62px;text-align:center;border-right:1px solid var(--line);padding-right:12px}
.date strong{display:block;font-size:1.6rem;line-height:1}
.date span{font-size:.8rem;color:var(--mute)}
.info{flex:1;min-width:0}
.info h3{margin:0;font-size:1rem}
.btns{display:flex;gap:6px;flex-wrap:wrap}.mb h4{margin:12px 0 4px}.mb ul{margin:0;padding-left:20px}.mb p{margin:4px 0}.sum{background:var(--bg);border-left:5px solid var(--amber);padding:8px 10px;border-radius:6px}
.chip{display:inline-block;font-size:.78rem;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute);margin-top:4px}
.chip.done{color:var(--ok);border-color:var(--ok)}
.chip.due{color:var(--ink);background:var(--amber);border-color:var(--amber)}
.row button{white-space:nowrap;padding:8px 10px;font-size:.9rem}
dialog{width:min(560px,94vw);border:0;border-radius:12px;padding:18px;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.55)}
label{display:block;font-weight:600;font-size:.9rem;margin:10px 0 3px}
input,textarea{width:100%;font:inherit;padding:9px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
footer{text-align:center;color:var(--mute);font-size:.82rem;padding:18px}
@media (max-width:480px){.row{flex-wrap:wrap}.row button{width:100%}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>Annual Security Training Program 2027</h1>
  <p>12 monthly sessions. Export the program, and record a report after every meeting.</p>
</header>
<main>
  <div class="bar">
    <button id="xl">Export program + material (Excel)</button>
    <button id="pd">Export program + material (PDF)</button>
    <button id="rx" class="alt">Export all reports (Excel)</button>
  </div>
  <div id="next" class="next"></div>
  <div id="list"></div>
</main>
<footer>Version 4 (includes training material and summaries). Works offline. Reports are saved on this device. Export them to Excel or PDF to keep a copy.</footer>

<dialog id="dlg">
  <h2 id="dt" style="margin:0 0 4px;font-size:1.15rem"></h2>
  <div id="ds" style="color:var(--mute);font-size:.9rem"></div>
  <div class="two">
    <div><label for="f_date">Date held</label><input id="f_date" type="date"></div>
    <div><label for="f_venue">Venue</label><input id="f_venue"></div>
  </div>
  <div class="two">
    <div><label for="f_trainer">Trainer / facilitator</label><input id="f_trainer"></div>
    <div><label for="f_dur">Duration (hours)</label><input id="f_dur" type="number" min="0" step="0.5"></div>
  </div>
  <label for="f_att">Attendees (one name per line)</label>
  <textarea id="f_att" rows="5"></textarea>
  <label for="f_cov">Points covered</label>
  <textarea id="f_cov" rows="3"></textarea>
  <label for="f_obs">Observations and challenges</label>
  <textarea id="f_obs" rows="3"></textarea>
  <label for="f_act">Action points and follow-up</label>
  <textarea id="f_act" rows="3"></textarea>
  <div class="act">
    <button id="sv">Save report</button>
    <button id="rp" class="alt">Download report (PDF)</button>
    <button id="cl" class="alt">Close</button>
  </div>
</dialog>

<dialog id="mdlg">
  <h2 id="mt" style="margin:0 0 4px;font-size:1.15rem"></h2>
  <div id="mb" class="mb"></div>
  <div class="act">
    <button id="mw">Write report</button>
    <button id="mp" class="alt">Download module (PDF)</button>
    <button id="mc" class="alt">Close</button>
  </div>
</dialog>

<script>
const P=[
["January","ACCESS CONTROL / GATE MANAGEMENT","2027-01-15"],
["February","SECURITY AWARENESS AND RESPONSIBILITIES","2027-02-12"],
["March","PATROLLING / SURVEILLANCE","2027-03-19"],
["April","SECURITY COMMUNICATION AND REPORTING","2027-04-30"],
["May","THEFT PREVENTION AND PROTECTION OF COMPANY ASSETS","2027-05-21"],
["June","EMERGENCY RESPONSE AND CRISIS MANAGEMENT","2027-06-25"],
["July","FIRE PREVENTION AND FIREFIGHTING TECHNIQUES","2027-07-23"],
["August","PROFESSIONAL CONDUCT AND DISCIPLINE","2027-08-20"],
["September","SECURITY INVESTIGATION TECHNIQUES","2027-09-24"],
["October","SITUATIONAL AWARENESS AND THREATS DETECTION","2027-10-29"],
["November","SECURITY DOCUMENTATION","2027-11-26"],
["December","REVIEW OF SECURITY ACTIVITIES IN THE OUTGOING YEAR","2027-12-10"]
];
const MAT=[
{o:"Control who and what enters and leaves Sunsteel Industries premises, consistently and courteously.",
k:["Verify the identity of every visitor, contractor and driver before entry; no ID, no entry.","Issue visitor and vehicle passes; record time in and out, host and purpose of visit.","Inspect vehicles, bags and goods at entry and exit as company policy allows.","Match outgoing goods against the gate pass or delivery document before release.","Keep the gate area clear; refuse unauthorised access and refer disputes to the supervisor.","Keep the gate register complete, legible and handed over at every shift change."],
a:"Gate staff apply Sunsteel's pass system to employees, visitors, haulage trucks and material movements.",

{o:"Make every guard understand their duties, limits of authority and the value of staying alert.",
k:["The guard's role: protect people, property and information; prevent rather than react.","Know your post orders, the site layout, key contacts and emergency numbers.","Authority is limited: observe, deter, report and detain only as the law and policy permit.","Report anything unusual, however small, to the supervisor at once.","Treat staff, visitors and the public with respect; stay neutral in disputes.","Be punctual, in correct uniform and fit for duty at all times."],
a:"Each Sunsteel guard should be able to explain their post orders and who to call for each type of incident.",
s:"Aware guards prevent incidents. Know your duties, know your limits, and report early."},
{o:"Carry out effective patrols and surveillance that deter and detect wrongdoing.",
k:["Plan routes and vary timings so patrol patterns are not predictable.","Check fences, doors, locks, lighting, stores and high-risk areas on each round.","Use the patrol clock, checkpoints or logbook to prove each round was done.","Watch CCTV actively: note camera faults, blind spots and suspicious behaviour.","Never patrol alone in unsafe areas without radio contact.","Record findings and report hazards such as damaged fences or faulty lights."],
a:"Patrols at Sunsteel cover the perimeter, yards, stores, production areas and car parks, day and night.",

{o:"Communicate clearly and write accurate, timely security reports.",
k:["Use the radio and phone correctly: be brief, clear and use agreed codes.","Know the reporting chain: guard, supervisor, security manager, management.","Reports answer who, what, when, where, why and how.","Stick to facts; do not guess or add opinion.","Write incident reports before going off duty while details are fresh.","Pass key information in person at shift handover."],
a:"Incidents at Sunsteel are reported on the company incident form and escalated through the security supervisor.",
s:"Clear communication and factual reports turn events into evidence and action."},
{o:"Prevent theft and protect Sunsteel Industries' assets, materials and finished goods.",
k:["Know the common theft risks: scrap and raw materials, tools, fuel, finished goods and staff property.","Control movement of goods with gate passes, waybills and signed authorisation.","Watch for warning signs: unusual loads, altered documents, loitering and collusion.","Secure stores, keys and high-value items; keep key registers current.","Apply search procedures fairly and consistently.","Preserve the scene and evidence when theft is discovered and report immediately."],
a:"Typical Sunsteel risks include metal scrap, tools, vehicles and stock moving through the gate and yards.",
s:"Theft prevention depends on controls and alertness. Control movement, secure stores and report early."},
{o:"Respond quickly and safely to emergencies and support crisis management.",
k:["Know the emergency types: fire, injury, intrusion, explosion, spill, civil disturbance.","Raise the alarm, call emergency services and inform the supervisor immediately.","Protect life first, then property; do not put yourself at needless risk.","Guide people to assembly points and keep roads clear for responders.","Control access to the scene and keep a log of times and actions.","Take part in drills and review lessons afterwards."],
a:"Sunsteel's emergency plan, assembly points and contact list should be known by every guard on every shift.",
s:"Alarm, protect life, control the scene, record, and practise through drills."},
{o:"Prevent fires and use firefighting equipment correctly.",
k:["The fire triangle: heat, fuel and oxygen; remove one to stop a fire.","Common causes: electrical faults, hot work, smoking, poor storage and housekeeping.","Know extinguisher types (water, foam, CO2, dry powder) and what each is for.","Use PASS: Pull, Aim, Squeeze, Sweep; fight a fire only if safe and the exit is behind you.","Check extinguishers, hydrants, alarms and exit routes; report faults.","On fire: raise the alarm, evacuate, call the fire service and meet at the assembly point."],
a:"Sunsteel's industrial areas with hot work and flammable materials need regular fire checks by security.",
s:"Prevent first, know your equipment, raise the alarm and put safety before property."},
{o:"Build professional behaviour and self-discipline across the security team.",
k:["Be honest, reliable and never accept bribes or favours.","Stay courteous and calm, even under provocation.","Keep a smart uniform and good personal hygiene.","Never sleep, drink alcohol or use phones for personal use on duty.","Respect confidentiality of company and visitor information.","Know the disciplinary code and report misconduct by anyone."],
a:"Guards represent Sunsteel Industries to every visitor and customer who passes the gate.",
s:"Discipline and integrity protect your reputation and the company's."},
{o:"Understand basic investigation methods for security incidents.",
k:["Secure and preserve the scene; limit access to those who must be there.","Document with notes, photographs and sketches before anything is moved.","Identify and interview witnesses separately; record statements accurately.","Handle evidence carefully, label it and keep a chain-of-custody record.","Review CCTV footage, registers and passes to establish the sequence of events.","Write a factual report with findings and recommendations, then hand over to management or police."],
a:"At Sunsteel, security assists management investigations and gives full records but does not accuse without evidence.",
s:"Preserve, document, interview, protect evidence and report objectively."},
{o:"Notice early signs of danger and respond before an incident develops.",
k:["Situational awareness: know what is normal, so you can spot what is not.","Warning signs: unfamiliar persons, surveillance of the site, unattended bags or vehicles, forced locks.","Keep scanning your surroundings; avoid distractions.","Trust your instinct and verify, without confronting dangerously.","Report threats at once and keep a safe distance.","Review threat risks regularly and adjust deployment."],
a:"Guards at Sunsteel should know normal routines at each post so unusual activity stands out.",
s:"See early, verify safely, report quickly."},
{o:"Keep accurate, complete and secure security records.",
k:["Key records: gate and visitor registers, patrol logs, incident reports, key register, shift handover book.","Write legibly, with date, time and signature; no erasing, strike through errors and initial.","Keep records in order and in a safe place; follow retention rules.","Protect personal and company information; share only on a need-to-know basis.","Use records to analyse trends and plan improvements.","Reports must be factual and ready for audit or investigation."],
a:"Sunsteel audits and investigations rely on good security records.",
s:"If it is not written down, it did not happen. Record accurately and keep it safe."},
{o:"Review the year's security performance and set priorities for the next year.",
k:["Review incidents, near misses, thefts, audits and drills carried out during 2027.","Measure results against the training program and attendance.","Identify recurring problems, root causes and gaps in skills or equipment.","Recognise good performance by individuals and teams.","Agree corrective actions, owners and deadlines.","Draft the training priorities for the coming year."],

s:"Learn from the year, fix the gaps and plan the next training cycle."}
];
const matItems=i=>{const m=MAT[i];return[{h:P[i][0].toUpperCase()+": "+P[i][1],size:12},{p:"Date: "+fmt(P[i][2])+"  |  Reference company: Sunsteel Industries"},{p:"Objective: "+m.o,bold:1},{p:"Training material:",bold:1},...m.k.map(x=>({p:"- "+x})),{p:"Application at Sunsteel Industries: "+m.a},{p:"Summary: "+m.s,bold:1},{h:" ",size:6}]};
const KEY="stp2027_reports";
let R={},cur=0;
try{R=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){R={}}
const $=id=>document.getElementById(id);
const FIELDS=["date","venue","trainer","dur","att","cov","obs","act"];
const ord=n=>{const s=["th","st","nd","rd"],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])};
const fmt=iso=>{const d=new Date(iso+"T00:00:00");return ord(d.getDate())+" "+P.find(p=>p[2]===iso)[0]+" 2027"};
function persist(){try{localStorage.setItem(KEY,JSON.stringify(R))}catch(e){alert("This device could not save the report. Download the PDF instead.")}}
function render(){
  const today=new Date().toISOString().slice(0,10);
  const nx=P.findIndex((p,i)=>!R[i]&&p[2]>=today);
  $("next").innerHTML=nx<0?"<b>All sessions are either completed or past their date.</b>":"<b>Next session</b>"+P[nx][1]+" on "+fmt(P[nx][2]);
  $("list").innerHTML=P.map((p,i)=>{
    const done=!!R[i],due=!done&&p[2]<today;
    const d=new Date(p[2]+"T00:00:00");
    return `<div class="row"><div class="date"><strong>${d.getDate()}</strong><span>${p[0].slice(0,3)}</span></div>
    <div class="info"><h3>${p[1]}</h3><span class="chip ${done?"done":due?"due":""}">${done?"Report saved":due?"Report due":"Upcoming"}</span></div>
    <div class="btns"><button class="alt" data-m="${i}">Training material</button><button class="${done?"alt":""}" data-i="${i}">${done?"View report":"Write report"}</button></div></div>`}).join("");
  document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>openM(+b.dataset.m));
  document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>openR(+b.dataset.i));
}
let mcur=0;
function openM(i){
  mcur=i;const m=MAT[i];
  $("mt").textContent=P[i][0]+": "+P[i][1];
  $("mb").innerHTML="<p><small>"+fmt(P[i][2])+" | Reference company: Sunsteel Industries</small></p><h4>Objective</h4><p>"+m.o+"</p><h4>Training material</h4><ul>"+m.k.map(x=>"<li>"+x+"</li>").join("")+"</ul><h4>Application at Sunsteel Industries</h4><p>"+m.a+"</p><h4>Summary</h4><p class=\"sum\">"+m.s+"</p>";
  $("mdlg").showModal();
}
$("mc").onclick=()=>$("mdlg").close();
$("mw").onclick=()=>{$("mdlg").close();openR(mcur)};
$("mp").onclick=()=>save(makePdf([{h:"SECURITY TRAINING PROGRAM 2027"},...matItems(mcur)]),"Training_Material_"+P[mcur][0]+"_2027.pdf");
function openR(i){
  cur=i;const r=R[i]||{date:P[i][2]};
  $("dt").textContent=P[i][0]+": "+P[i][1];
  $("ds").textContent="Scheduled for "+fmt(P[i][2]);
  FIELDS.forEach(f=>$("f_"+f).value=r[f]||"");
  $("dlg").showModal();
}
function grab(){const r={};FIELDS.forEach(f=>r[f]=$("f_"+f).value.trim());r.saved=new Date().toISOString();return r}
$("sv").onclick=()=>{R[cur]=grab();persist();$("dlg").close();render()};
$("cl").onclick=()=>$("dlg").close();
const names=a=>(a||"").split("\n").map(s=>s.trim()).filter(Boolean);

/* ---- Offline export tools (no internet libraries needed) ---- */
const enc=new TextEncoder();
const CT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CT[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
function zip(files){
  const parts=[],cen=[];let off=0;
  for(const [name,txt] of files){
    const n=enc.encode(name),d=enc.encode(txt),c=crc(d);
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint32(14,c,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,n.length,true);
    parts.push(new Uint8Array(h.buffer),n,d);
    const e=new DataView(new ArrayBuffer(46));
    e.setUint32(0,0x02014b50,true);e.setUint16(4,20,true);e.setUint16(6,20,true);e.setUint32(16,c,true);e.setUint32(20,d.length,true);e.setUint32(24,d.length,true);e.setUint16(28,n.length,true);e.setUint32(42,off,true);
    cen.push(new Uint8Array(e.buffer),n);
    off+=30+n.length+d.length;
  }
  let cl=0;cen.forEach(x=>cl+=x.length);
  const f=new DataView(new ArrayBuffer(22));
  f.setUint32(0,0x06054b50,true);f.setUint16(8,files.length,true);f.setUint16(10,files.length,true);f.setUint32(12,cl,true);f.setUint32(16,off,true);
  return new Blob([...parts,...cen,new Uint8Array(f.buffer)],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
const xe=s=>String(s==null?"":s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const col=i=>{let s="";i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s};
function makeXlsx(sheet,rows,widths){
  const sd=rows.map((r,ri)=>`<row r="${ri+1}">`+r.map((v,ci)=>{const ref=col(ci)+(ri+1);return typeof v==="number"?`<c r="${ref}"><v>${v}</v></c>`:`<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xe(v)}</t></is></c>`}).join("")+"</row>").join("");
  const cols="<cols>"+widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join("")+"</cols>";
  const H='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  return zip([
   ["[Content_Types].xml",H+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>'],
   ["_rels/.rels",H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],
   ["xl/workbook.xml",H+`<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${xe(sheet)}" sheetId="1" r:id="rId1"/></sheets></workbook>`],
   ["xl/_rels/workbook.xml.rels",H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>'],
   ["xl/worksheets/sheet1.xml",H+`<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${cols}<sheetData>${sd}</sheetData></worksheet>`]
  ]);
}
function makePdf(items){
  const W=595,H=842,M=40,pages=[];let cur,y;
  const esc=s=>String(s==null?"":s).replace(/[^\x20-\xFF]/g,"?").replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)");
  const np=()=>{cur=[];pages.push(cur);y=H-M};np();
  const wrap=(s,n)=>{const o=[];String(s==null?"":s).split("\n").forEach(p=>{let l="";p.split(" ").forEach(w=>{while(w.length>n){if(l){o.push(l);l=""}o.push(w.slice(0,n));w=w.slice(n)}if((l+" "+w).trim().length>n){o.push(l);l=w}else l=(l+" "+w).trim()});o.push(l)});return o};
  const T=(f,sz,x,yy,s)=>`BT /${f} ${sz} Tf ${x} ${yy} Td (${esc(s)}) Tj ET`;
  for(const it of items){
    if(it.h){if(y-30<M)np();cur.push("0 g",T("F2",it.size||14,M,y-14,it.h));y-=(it.size||14)+12;continue}
    if(it.p){const sz=10,n=Math.floor((W-2*M)/(sz*0.55));for(const l of wrap(it.p,n)){if(y-14<M)np();cur.push("0 g",T(it.bold?"F2":"F1",sz,M,y-11,l));y-=13}y-=3;continue}
    const cw=it.w.map(w=>w/it.w.reduce((a,b)=>a+b)*(W-2*M));
    const ls=it.row.map((c,i)=>wrap(c,Math.max(3,Math.floor((cw[i]-8)/5.3))));
    const n=Math.max(1,...ls.map(l=>l.length)),h=n*12+8;
    if(y-h<M)np();
    let x=M;
    ls.forEach((l,i)=>{
      if(it.head)cur.push("0.11 0.21 0.34 rg",`${x} ${y-h} ${cw[i]} ${h} re f`,"1 g");
      else cur.push("0 G 0.5 w",`${x} ${y-h} ${cw[i]} ${h} re S`,"0 g");
      l.forEach((t,k)=>cur.push(T(it.head||(it.bold0&&i===0)?"F2":"F1",10,x+4,y-12-k*12,t)));

  let out="%PDF-1.4\n";const offs=[];
  const add=(i,s)=>{offs[i]=out.length;out+=i+" 0 obj\n"+s+"\nendobj\n"};
  const kids=pages.map((_,k)=>(6+2*k)+" 0 R").join(" ");
  add(1,"<< /Type /Catalog /Pages 2 0 R >>");
  add(2,`<< /Type /Pages /Kids [${kids}] /Count ${pages.length} >>`);
  add(3,"<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
  add(4,"<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
  pages.forEach((p,k)=>{const s=p.join("\n");add(5+2*k,`<< /Length ${s.length} >>\nstream\n${s}\nendstream`);add(6+2*k,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${5+2*k} 0 R >>`)});
  const total=5+2*pages.length,xr=out.length;
  out+=`xref\n0 ${total}\n0000000000 65535 f \n`;
  for(let i=1;i<total;i++)out+=String(offs[i]).padStart(10,"0")+" 00000 n \n";
  out+=`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`;
  const u=new Uint8Array(out.length);for(let i=0;i<out.length;i++)u[i]=out.charCodeAt(i)&255;
  return new Blob([u],{type:"application/pdf"});
}
